name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          New-Item -ItemType Directory -Path signing -Force | Out-Null
          [IO.File]::WriteAllBytes(
            (Join-Path $PWD "signing\shapeeditor-release.keystore"),
            [Convert]::FromBase64String($env:KEYSTORE_BASE64)
          )

      - name: Publish signed APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dotnet publish ShapeEditor.Maui/ShapeEditor.Maui.csproj `
            -c Release `
            -f net10.0-android `
            --self-contained true `
            -p:AndroidPackageFormats=apk `
            -p:AndroidFastDeployment=false `
            -p:EmbedAssembliesIntoApk=true `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="$PWD\signing\shapeeditor-release.keystore" `
            -p:AndroidSigningKeyAlias=shapeeditor `
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD `
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD

      - name: Prepare release asset
        shell: pwsh
        run: |
          $source = "ShapeEditor.Maui\bin\Release\net10.0-android\publish\com.wyucnk.shapeeditor-Signed.apk"
          if (-not (Test-Path $source)) {
            throw "Signed APK not found: $source"
          }

          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item $source "release-assets\ShapeEditor-android-universal.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/ShapeEditor-android-universal.apk
          generate_release_notes: true