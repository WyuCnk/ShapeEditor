name: Deploy Blazor WebAssembly to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Web
        run: dotnet publish ShapeEditor.Web/ShapeEditor.Web.csproj -c Release -o release

      - name: Prepare GitHub Pages files
        run: |
          sed -i 's#<base href="/" />#<base href="/ShapeEditor/" />#' release/wwwroot/index.html
          cp release/wwwroot/index.html release/wwwroot/404.html
    touch release/wwwroot/.nojekyll

      - name: Add GitHub Pages fallback
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4